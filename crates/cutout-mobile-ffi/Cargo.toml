[package]
name = "cutout-mobile-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Concrete UniFFI mobile binding surface for Cutout"
readme = "../../README.md"
keywords = ["ble", "pev", "ffi", "mobile"]
categories = ["hardware-support", "api-bindings"]

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[lints]
workspace = true

[dependencies]
cutout-core = { path = "../cutout-core", version = "0.1.0", features = ["serde"] }
cutout-ride-maps = { path = "../cutout-ride-maps", version = "0.1.0" }
libcutout-persistence = { path = "../libcutout-persistence", version = "0.1.0" }
cutout-protocols = { path = "../cutout-protocols", version = "0.1.0" }
thiserror.workspace = true
uniffi.workspace = true
uuid.workspace = true

[dev-dependencies]
hex-literal.workspace = true
