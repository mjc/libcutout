[workspace]
resolver = "3"
exclude = ["vendor/retina", "vendor/askama_derive"]
members = [
    "crates/cutout-core",
    "crates/cutout-music",
    "crates/cutout-ride-maps",
    "crates/libcutout-persistence",
    "crates/cutout-protocols",
    "crates/cutout-mobile-ffi",
    "crates/cutout-btle",
    "crates/cutout-cli",
    "crates/cutout-uniffi-bindgen",
    "crates/cutout-dev",
    "crates/cutout-soundcloud-auth-broker",
    "crates/cutout-server",
]
default-members = [
    "crates/cutout-core",
    "crates/cutout-music",
    "crates/cutout-protocols",
    "crates/cutout-mobile-ffi",
    "crates/cutout-btle",
    "crates/cutout-cli",
]

[profile.release]
strip = "none"

[patch.crates-io]
askama_derive = { path = "vendor/askama_derive" }
retina = { path = "vendor/retina" }

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mjc/libcutout"

[workspace.dependencies]
async-trait = "0.1.92"
anyhow = "1.0.104"
bitflags = "2.13.2"
btleplug = "0.13.5"
bytes = { version = "1.12.1", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.3"
crc = { version = "3.4.0", default-features = false }
futures-util = "0.3.34"
hex = "0.4.3"
hex-literal = "1.1.0"
jni = "0.22.4"
miniz_oxide = "=0.9.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "termina"] }
retina = { version = "=0.4.21", default-features = false }
proptest = "1.12.0"
quick-xml = { version = "=0.42.0", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint", "hooks", "limits"] }
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
smallvec = "1.16.3"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uniffi = "0.32.2"
uuid = { version = "1.28.0", features = ["v4"] }
vesc = { version = "0.4.0", default-features = false }
arrayvec = { version = "0.7.8", features = ["serde"] }
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-platform-verifier = "0.7.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
disallowed_macros = "deny"
# Explicit matches are the production policy; do not recommend the banned macro.
match_like_matches_macro = "allow"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_crate_versions = "allow"

# Production Rust crates also use crate-level `cfg_attr(not(test), deny(...))`
# for `clippy::unwrap_used`, `clippy::expect_used`, and `clippy::panic`.
# Those footgun lints intentionally stay outside workspace.lints so tests can
# keep clear assertion/setup `expect` messages without broad production allows.
