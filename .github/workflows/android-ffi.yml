name: Android FFI

on:
  workflow_dispatch:
  pull_request:
    paths: &android-paths
      - 'crates/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'devenv.*'
      - 'tests/mobile-ffi/**'
      - 'android/**'
      - 'swift/CutoutMobile/**/Localizable.xcstrings'
      - 'scripts/test-mobile-ffi.py'
      - '.github/workflows/android-ffi.yml'
  push:
    branches: [main]
    paths: *android-paths

permissions:
  contents: read

concurrency:
  group: android-ffi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bindings-and-apks:
    # This standard runner is ARM64. The Android NDK's Darwin tools support it.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - name: Host bindings, then Android APKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          # Reuse the repository's nixpkgs pin for the CLI as well as its tools.
          revision=$(python3 -c 'import json; print(json.load(open("devenv.lock"))["nodes"]["nixpkgs"]["locked"]["rev"])')
          for task in test:kotlin-bindings-smoke test:android-ui build:android-tests; do
            nix run "github:NixOS/nixpkgs/$revision#devenv" -- --no-tui --max-jobs 1 --cores 2 tasks run "$task" --show-output
          done
      - name: Keep test and build receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ffi-results
          path: target/test-logs/mobile-ffi-*/
          retention-days: 5
          if-no-files-found: ignore
