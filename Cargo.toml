[workspace]
resolver = "3"
members = [
    "crates/cutout-core",
    "crates/cutout-ride-maps",
    "crates/cutout-protocols",
    "crates/cutout-mobile-ffi",
    "crates/cutout-btle",
    "crates/cutout-cli",
    "crates/cutout-uniffi-bindgen",
]
default-members = [
    "crates/cutout-core",
    "crates/cutout-protocols",
    "crates/cutout-mobile-ffi",
    "crates/cutout-btle",
    "crates/cutout-cli",
]

[profile.release]
strip = "none"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mjc/libcutout"

[workspace.dependencies]
async-trait = "0.1"
anyhow = "1"
bitflags = "2"
btleplug = "0.12"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
futures-util = "0.3"
hex = "0.4"
hex-literal = "1"
mio = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "termina"] }
proptest = "1"
rusqlite = { version = "0.37", default-features = false, features = ["bundled", "limits"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
smallvec = "1"
smol = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uniffi = "0.31.2"
uuid = { version = "1", features = ["v4"] }
vesc = { version = "0.4", default-features = false }
zerocopy = "0.8"
arrayvec = { version = "0.7", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_crate_versions = "allow"

# Production Rust crates also use crate-level `cfg_attr(not(test), deny(...))`
# for `clippy::unwrap_used`, `clippy::expect_used`, and `clippy::panic`.
# Those footgun lints intentionally stay outside workspace.lints so tests can
# keep clear assertion/setup `expect` messages without broad production allows.
