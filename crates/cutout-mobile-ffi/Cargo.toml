[package]
name = "cutout-mobile-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Concrete UniFFI mobile binding surface for Cutout"
readme = "../../README.md"
keywords = ["ble", "pev", "ffi", "mobile"]
categories = ["hardware-support", "api-bindings"]

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[lints]
workspace = true

[dependencies]
jni.workspace = true
hex.workspace = true
futures-util.workspace = true
cutout-music = { path = "../cutout-music", version = "0.1.0" }
cutout-core = { path = "../cutout-core", version = "0.1.0", features = ["serde", "http"] }
cutout-ride-maps = { path = "../cutout-ride-maps", version = "0.1.0" }
libcutout-persistence = { path = "../libcutout-persistence", version = "0.1.0", default-features = false }
cutout-protocols = { path = "../cutout-protocols", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["stream"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
uniffi = { workspace = true, features = ["tokio"] }
uuid.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
hex-literal.workspace = true
axum.workspace = true
cutout-server = { path = "../cutout-server", version = "0.1.0" }
rusqlite.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
