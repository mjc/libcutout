[workspace]
resolver = "3"
members = [
    "crates/cutout-core",
    "crates/cutout-protocols",
    "crates/cutout-btle",
    "crates/cutout-cli",
]
default-members = [
    "crates/cutout-core",
    "crates/cutout-protocols",
    "crates/cutout-btle",
    "crates/cutout-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mjc/libcutout"

[workspace.dependencies]
async-trait = "0.1"
anyhow = "1"
bitflags = "2"
btleplug = "0.12"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
futures-util = "0.3"
hex = "0.4"
hex-literal = "1"
mio = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
smol = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"
zerocopy = "0.8"
arrayvec = "0.7"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_crate_versions = "allow"
