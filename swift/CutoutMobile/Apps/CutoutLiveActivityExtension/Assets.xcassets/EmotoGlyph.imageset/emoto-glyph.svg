<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="stroke" x1="106" y1="292" x2="906" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B17CFF"/>
      <stop offset="0.52" stop-color="#7F72FF"/>
      <stop offset="1" stop-color="#5B54D7"/>
    </linearGradient>
    <linearGradient id="dim" x1="146" y1="312" x2="850" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8C86FF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#4B4AAE" stop-opacity="0.64"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 1  0 0 0 0.55 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <circle cx="245" cy="677" r="116" stroke="url(#stroke)" stroke-width="34"/>
    <circle cx="783" cy="677" r="116" stroke="url(#stroke)" stroke-width="34"/>
    <circle cx="245" cy="677" r="42" stroke="url(#dim)" stroke-width="20" opacity="0.88"/>
    <circle cx="783" cy="677" r="42" stroke="url(#dim)" stroke-width="20" opacity="0.88"/>
    <path d="M167 677 H323 M245 599 V755 M190 622 L300 732 M300 622 L190 732" stroke="url(#dim)" stroke-width="13" opacity="0.52"/>
    <path d="M705 677 H861 M783 599 V755 M728 622 L838 732 M838 622 L728 732" stroke="url(#dim)" stroke-width="13" opacity="0.52"/>

    <!-- chassis / supermoto silhouette -->
    <path d="M134 527 C229 480 344 459 456 472 C551 483 648 466 752 433 C818 413 875 420 923 455" stroke="url(#stroke)" stroke-width="31"/>
    <path d="M161 516 C260 520 363 522 462 518 C554 514 635 498 720 470" stroke="url(#dim)" stroke-width="19" opacity="0.72"/>
    <path d="M334 448 C415 430 512 439 608 474" stroke="url(#stroke)" stroke-width="26"/>
    <path d="M132 529 L91 558" stroke="url(#dim)" stroke-width="23" opacity="0.78"/>

    <!-- seat and tail -->
    <path d="M232 430 C335 411 470 418 604 444" stroke="url(#stroke)" stroke-width="30"/>
    <path d="M95 420 C144 430 193 433 232 430" stroke="url(#stroke)" stroke-width="27"/>
    <path d="M78 431 C112 398 163 383 228 393" stroke="url(#dim)" stroke-width="20" opacity="0.66"/>
    <path d="M112 459 C176 462 225 457 272 438" stroke="url(#dim)" stroke-width="16" opacity="0.52"/>

    <!-- front fender, fork, bars -->
    <path d="M738 412 C815 377 887 383 940 428" stroke="url(#stroke)" stroke-width="28"/>
    <path d="M699 374 L784 677" stroke="url(#stroke)" stroke-width="28"/>
    <path d="M745 366 L823 660" stroke="url(#dim)" stroke-width="20" opacity="0.76"/>
    <path d="M669 330 C706 318 748 329 785 360" stroke="url(#stroke)" stroke-width="24"/>
    <path d="M692 319 L708 284" stroke="url(#dim)" stroke-width="18" opacity="0.82"/>
    <path d="M694 285 C725 276 757 284 783 307" stroke="url(#stroke)" stroke-width="20"/>
    <path d="M773 304 L817 280" stroke="url(#dim)" stroke-width="17" opacity="0.76"/>

    <!-- battery/motor mass -->
    <path d="M425 520 L594 492 L674 568 L610 681 L429 682 L366 593 Z" stroke="url(#stroke)" stroke-width="30"/>
    <path d="M430 530 L593 506 L648 568 L597 653 L445 654 L398 594 Z" stroke="url(#dim)" stroke-width="18" opacity="0.62"/>
    <path d="M471 545 H585 M451 583 H617 M441 621 H602" stroke="url(#dim)" stroke-width="15" opacity="0.48"/>
    <circle cx="407" cy="640" r="48" stroke="url(#stroke)" stroke-width="24" opacity="0.92"/>

    <!-- swingarm and lower linkage -->
    <path d="M250 677 L407 640 L603 676" stroke="url(#stroke)" stroke-width="28"/>
    <path d="M250 677 L395 703 L603 676" stroke="url(#dim)" stroke-width="19" opacity="0.68"/>
    <path d="M347 494 L250 677" stroke="url(#dim)" stroke-width="19" opacity="0.64"/>
    <path d="M334 543 L406 640" stroke="url(#stroke)" stroke-width="22" opacity="0.86"/>

    <!-- sharp graphic cuts to echo emoto plastics without brand detail -->
    <path d="M502 458 L604 508 L532 517" stroke="url(#dim)" stroke-width="18" opacity="0.62"/>
    <path d="M585 453 L680 432 L640 495" stroke="url(#dim)" stroke-width="17" opacity="0.54"/>
    <path d="M278 462 L352 476 L304 506" stroke="url(#dim)" stroke-width="17" opacity="0.54"/>
  </g>
</svg>
