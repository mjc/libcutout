[package]
name = "cutout-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cutout music, charging and website server"

[dependencies]
hex.workspace = true
axum.workspace = true
clap.workspace = true
cutout-ride-maps = { path = "../cutout-ride-maps", version = "0.1.0" }
cutout-core = { path = "../cutout-core", version = "0.1.0", features = ["serde", "http"] }
futures-util.workspace = true
cutout-soundcloud-auth-broker = { path = "../cutout-soundcloud-auth-broker", version = "0.1.0" }
rusqlite = { workspace = true, features = ["blob"] }
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "fs", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
