<style>
:root{color-scheme:light;--bg:#f2f2f7;--paper:#fff;--card:#f2f2f7;--raised:#fff;--ink:#191919;--muted:#65656b;--line:#dedee4;--accent:#ffcc00;--accentText:#765400;--tint:#fff6cd;--green:#1b7045;--greenbg:#e6f4ec;--blue:#14639b;--map:#e8ebdf;--road:#fff;--water:#b9d9e5;--park:#cbdaba;--shadow:0 20px 55px #1515150b}
[data-theme=dark]{color-scheme:dark;--bg:#101011;--paper:#000;--card:#1c1c1e;--raised:#2c2c2e;--ink:#f5f5f7;--muted:#b1b1b7;--line:#363638;--accentText:#ffdb49;--tint:#302a0d;--green:#8bddad;--greenbg:#142c20;--blue:#8ac9ff;--map:#222c26;--road:#435049;--water:#284957;--park:#324d36;--shadow:0 20px 55px #0004}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.4}button,select,input{font:inherit}button,select{cursor:pointer}button{min-height:44px;border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--ink);font-weight:650}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button:disabled{cursor:default;opacity:.55}a{color:var(--blue)}h1,h2,h3,p{margin:0}h1{font-size:32px;letter-spacing:-1px}h2{font-size:27px;letter-spacing:-.8px;line-height:1.15}h3{font-size:17px;letter-spacing:-.2px}.muted{color:var(--muted)}.tiny{font-size:11px}.small{font-size:13px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:750;color:var(--muted)}.pagehead{max-width:1660px;margin:auto;padding:38px 25px 24px;display:flex;justify-content:space-between;gap:20px;align-items:end}.pagehead p{max-width:690px;margin-top:9px}.reviewbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.reviewbar select{max-width:220px;border:1px solid var(--line);padding:11px;border-radius:12px;background:var(--paper);color:var(--ink);min-height:44px}.stage{display:flex;justify-content:center;gap:32px;padding:12px 20px 40px}.designnote{width:290px;padding-top:36px}.designnote h3{margin:18px 0 8px}.designnote p{margin-bottom:12px}.gallery{max-width:1660px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 22px;padding:15px 22px 50px}.comp{min-width:0}.comp>p{margin:12px 5px 0;font-size:13px;color:var(--muted)}.comp>p b{color:var(--ink)}.phone{width:375px;height:800px;background:var(--paper);border:1px solid var(--line);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);margin:auto;position:relative}.topbar{height:36px;padding:10px 22px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:750;flex-shrink:0}.protolabel{font-size:10px;letter-spacing:.7px;text-transform:uppercase;text-align:center;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}.content{padding:18px 18px 22px;overflow:auto;flex:1;scrollbar-width:thin}.navback{margin:-7px 0 10px -8px;padding:8px;background:none;color:var(--accentText);font-size:13px;min-height:36px}.titleline{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.titleline button{background:none;padding:3px 6px;font-size:21px}.intro{font-size:13px;color:var(--muted);margin-top:7px}.tabs{display:flex;gap:3px;border-radius:11px;background:var(--card);padding:3px;margin:17px 0}.tabs button{font-size:13px;flex:1;border-radius:8px;background:transparent;padding:6px 5px;min-height:40px}.tabs button[aria-pressed=true]{background:var(--raised);box-shadow:0 1px 5px #0001}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:20px 0 9px}.sectiontitle button{min-height:32px;padding:4px 0;color:var(--accentText);background:none;font-size:13px}.card{background:var(--card);border-radius:16px;padding:15px;margin-top:12px}.card.tint{background:var(--tint)}.card.green{background:var(--greenbg)}.card h3{margin-bottom:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0;padding-bottom:2px}.row:first-child{padding-top:2px}.row .left{flex:1;min-width:0}.row small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.row button{font-size:13px;padding:7px 12px}.badge{display:inline-flex;border-radius:7px;background:var(--raised);padding:4px 7px;font-size:11px;font-weight:700;white-space:nowrap}.badge.good{color:var(--green);background:var(--greenbg)}.badge.gold{background:var(--tint);color:var(--accentText)}.metric{font-size:38px;font-weight:750;letter-spacing:-1.5px;line-height:1.12}.metric small{font-size:17px;letter-spacing:0;font-weight:500}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.statgrid strong{font-size:22px;display:block;letter-spacing:-.5px}.statgrid span{font-size:12px;color:var(--muted)}.primary{background:var(--accent);color:#211b00;width:100%;margin-top:15px}.secondary{width:100%;margin-top:8px;background:var(--card)}.linkbtn{background:none;color:var(--accentText);padding:8px 0;min-height:38px}.bottomnav{border-top:1px solid var(--line);padding:9px 18px 15px;display:flex;justify-content:space-around;font-size:10px;flex-shrink:0;background:var(--paper)}.bottomnav span{display:block;text-align:center;color:var(--muted)}.bottomnav b{font-size:21px;display:block;font-weight:400;line-height:1.1;margin-bottom:3px}.bottomnav .active{color:var(--accentText)}.spark{display:flex;align-items:end;gap:8px;height:65px;margin-top:12px}.spark i{background:var(--accent);border-radius:4px 4px 0 0;flex:1}.spark i:nth-child(2n){opacity:.5}.sparklabels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:4px}.filters{display:flex;gap:8px;margin:12px 0}.filters select{border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font-size:12px;min-height:44px;padding:8px;max-width:53%}.standings{padding:0 12px}.rankrow{display:grid;grid-template-columns:24px 31px 1fr auto;gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.rankrow:last-child{border-bottom:0}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:750;background:var(--raised)}.rankrow strong{font-size:13px}.rankrow .score{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}.rankrow small{display:block;font-size:10px;color:var(--muted);font-weight:400}.rankrow.me{background:var(--tint);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:10px}.map{background:var(--map);border-radius:15px;overflow:hidden;margin-top:15px;position:relative;height:180px}.map svg{width:100%;height:100%;display:block}.map .caption{position:absolute;bottom:9px;left:10px;background:var(--paper);border-radius:7px;padding:4px 7px;font-size:10px}.map .maplabel{position:absolute;right:12px;top:12px;color:var(--muted);font-size:10px}.check{display:flex;align-items:start;gap:10px;min-height:50px;padding:12px 0;border-bottom:1px solid var(--line)}.check:last-child{border:0}.check input{width:21px;height:21px;accent-color:#997300;flex-shrink:0}.check span{font-weight:650;font-size:14px}.check small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}.providericon{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;background:var(--raised);font-size:16px;font-weight:800;flex-shrink:0}.timeline{list-style:none;padding:0;margin:15px 0 0}.timeline li{display:flex;gap:12px;position:relative;padding-bottom:21px;font-size:13px}.timeline li:last-child{padding-bottom:0}.dot{height:23px;width:23px;display:grid;place-items:center;border-radius:50%;background:var(--card);color:var(--muted);font-size:12px;flex-shrink:0}.done .dot{background:var(--greenbg);color:var(--green)}.current .dot{background:var(--accent);color:#211b00}.timeline small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.statusbox{padding:16px;border:1px solid var(--line);border-radius:15px;margin-top:18px}.statusbox strong{font-size:19px}.statusbox p{font-size:13px;color:var(--muted);margin-top:5px}.notice{padding:11px 12px;border-radius:11px;border:1px solid var(--line);font-size:12px;color:var(--muted);margin-top:13px}.progress{height:8px;border-radius:5px;background:var(--raised);overflow:hidden;margin:14px 0 8px}.progress i{display:block;background:var(--accent);height:100%;width:68%}.listitem{display:flex;justify-content:space-between;padding:10px 0;font-size:13px;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.bullet{color:var(--green);font-weight:750;margin-right:5px}.subtle{border:1px solid var(--line);background:none}.sr{position:absolute;left:-10000px}.footnote{font-size:11px;color:var(--muted);margin-top:13px;line-height:1.45}
@media(max-width:1590px){.gallery{grid-template-columns:repeat(3,minmax(375px,1fr))}}@media(max-width:1200px){.gallery{grid-template-columns:repeat(2,minmax(375px,1fr))}.pagehead{align-items:start;flex-direction:column}}@media(max-width:800px){.gallery{grid-template-columns:1fr}.designnote{display:none}.pagehead{padding:22px 16px}.phone{max-width:100%}.stage{padding:10px 8px 30px}.gallery{padding:10px 8px 30px}.reviewbar{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<link rel="stylesheet" href="refined.css">
<body>
<header class="pagehead"><div><div class="eyebrow">CutOut / Community / Design proposal 02</div><h1>Connected leaderboards.</h1><p class="muted">Hermes, FloatRank and EUC Stats, using the rides you already record in CutOut.</p></div><div class="reviewbar"><label for="screen" class="sr">Screen</label><select id="screen"><option value="community">Community</option><option value="standings">Standings</option><option value="ride">Saved ride · Services</option><option value="review">Review submission</option><option value="status">Submission status</option><option value="connections">Connections</option><option value="trail">Trail results</option><option value="challenge">Later · CutOut challenge</option></select><label for="scenario" class="sr">Sample state</label><select id="scenario"><option value="normal">Normal</option><option value="loading">Loading</option><option value="empty">No results</option><option value="offline">Offline cache</option><option value="error">Provider unavailable</option><option value="limited">Reads unavailable</option></select><button id="appearance" aria-pressed="false">Dark appearance</button><button id="sheet" aria-pressed="false">Screen set</button></div></header>
<main id="main"></main>
<script>
const params=new URLSearchParams(location.search);
const screens=['community','standings','ride','review','status','connections','trail','challenge'];
let state={screen:screens.includes(params.get('screen'))?params.get('screen'):'community',provider:'FloatRank',theme:params.get('theme')==='dark'?'dark':'light',gallery:params.get('gallery')==='1',selected:{Hermes:true,FloatRank:true,'EUC Stats':false},status:'Queued',limited:false,scenario:'normal',connected:true,period:'This month'};
const boards={FloatRank:{metric:'Mileage',total:'184.2',unit:'mi',rank:24,count:'318',cohort:'Onewheel',first:'264.8',second:'251.1',third:'239.5',prev:'186.7',next:'180.4',note:'FloatRank total · includes linked apps'},Hermes:{metric:'Pine Loop · best attempt',total:'02:41',unit:'',rank:8,count:'42',cohort:'Onewheel · Fall season',first:'02:29',second:'02:31',third:'02:33',prev:'02:40',next:'02:45',note:'Provider results · course version shown in details'},'EUC Stats':{metric:'Distance',total:'221.6',unit:'mi',rank:12,count:'186',cohort:'EUC · accepted trips',first:'383.2',second:'359.4',third:'341.8',prev:'223.9',next:'218.0',note:'EUC Stats · accepted trips only'}};
const btn=(text,action,cls='secondary',extra='')=>`<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`;
function boardFor(s){const b={...boards[s.provider]};if(s.period==='This week'&&s.provider!=='Hermes'){Object.assign(b,s.provider==='FloatRank'?{total:'47.3',rank:31,count:'249',first:'96.2',second:'89.1',third:'83.7',prev:'48.2',next:'46.1'}:{total:'62.8',rank:16,count:'143',first:'109.6',second:'101.5',third:'98.4',prev:'64.1',next:'61.7'})}return b}
function tabs(s){return `<div class="tabs" aria-label="Leaderboard provider">${Object.keys(boards).map(p=>`<button data-provider="${p}" aria-pressed="${s.provider===p}">${p}</button>`).join('')}</div>`}
function map(caption='Recorded route · illustrative geography'){return `<div class="map" role="img" aria-label="Illustrative segmented route through a park; not a real trail"><svg viewBox="0 0 340 190" aria-hidden="true"><path d="M0 15L340 170M-20 100L290 0M10 200L350 30" stroke="var(--road)" stroke-width="14"/><path d="M200 -30Q120 50 210 120T210 230" stroke="var(--water)" stroke-width="25" fill="none"/><path d="M28 55Q95 0 125 60T70 145Q0 135 28 55M245 30Q330 20 320 88T250 120Z" fill="var(--park)"/><path d="M38 125Q62 145 97 111T134 76Q144 54 175 57" stroke="var(--accentText)" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M180 58Q230 63 260 95T298 104" stroke="var(--accentText)" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="38" cy="125" r="7" fill="var(--paper)" stroke="var(--accentText)" stroke-width="3"/><circle cx="298" cy="104" r="7" fill="var(--accent)" stroke="var(--ink)" stroke-width="2"/></svg><span class="maplabel">Sample map</span><span class="caption">${caption}</span></div>`}
function heading(t,sub,back='community'){return `${back?btn('‹ Community',back,'navback'):''}<h2>${t}</h2>${sub?`<p class="intro">${sub}</p>`:''}`}
function ranklist(s){const b=boardFor(s);return `<div class="card standings">${[['1','AR','Alex R.',b.first,''],['2','JL','Jamie L.',b.second,''],['3','SK','Sam K.',b.third,''],[String(b.rank-1),'TC','Taylor C.',b.prev,''],[String(b.rank),'YO','You',b.total,'me'],[String(b.rank+1),'MN','Morgan N.',b.next,'']].map(([rank,initial,name,value,cls],i)=>`${i===3?'<div class="tiny muted" style="padding-top:8px">··· Nearby positions</div>':''}<div class="rankrow ${cls}"><span class="muted">${rank}</span><span class="avatar">${initial}</span><strong>${name}<small>${name==='You'?'Your linked account':s.provider==='Hermes'?'Oct 14 · Onewheel':'Linked rider'}</small></strong><span class="score">${value}<small>${b.unit||'min:sec'}</small></span></div>`).join('')}</div>`}
function capabilityFallback(s){return `<div class="card"><h3>View standings on ${s.provider}</h3><p class="small muted">You can send rides to this service. Standings are available on its website.</p>${btn(`Open ${s.provider}`,'external')}</div>`}
function body(screen,s){const b=boardFor(s);if(['community','standings'].includes(screen)&&['loading','empty','error'].includes(s.scenario))return `${heading(screen==='community'?'Community':'Leaderboards','Sample provider state',screen==='community'?null:'community')}${tabs(s)}<div class="card"><h3>${{loading:'Loading standings…',empty:'No eligible results yet',error:'Provider unavailable'}[s.scenario]}</h3><p class="small muted">${{loading:'Your saved rides remain available.',empty:'This provider has no results for the selected period and cohort.',error:'Try again later. Ride recording is still available.'}[s.scenario]}</p>${s.scenario==='error'?btn('Retry sample request','retry','primary'):''}</div>`;const offline=s.scenario==='offline'?'<div class="notice">Offline · cached snapshot from 3:40 PM. Positions may have changed.</div>':'';switch(screen){
case 'community':return `${heading('Community','Your standings, rides and events.',null)}${tabs(s)}${offline}<div class="card tint"><div class="eyebrow">${s.provider==='Hermes'?'Fall season':s.period} · ${s.provider}</div><h3 style="margin-top:8px">${b.metric}</h3><div class="metric" style="margin-top:10px">${b.total} <small>${b.unit}</small></div><div class="spark" aria-hidden="true">${[35,44,29,61,48,72,90].map(h=>`<i style="height:${h}%"></i>`).join('')}</div><div class="sparklabels"><span>${s.period==='This week'?'Oct 12':'Oct 1'}</span><span>Oct 15</span></div><div class="herofoot"><b>#${b.rank} of ${b.count} riders</b><span>${b.cohort}</span></div></div>${(s.limited||s.scenario==='limited')?capabilityFallback(s):btn('View standings','standings','primary')}<div class="providerstamp"><i></i>${s.provider} · updated 3:40 PM</div><div class="sectiontitle"><h3>Your last ride</h3>${btn('Services','ride','linkbtn')}</div><div class="card" style="margin-top:0"><div class="row"><div class="left"><b>Afternoon loop</b><small>Today · 12.4 mi · Onewheel</small></div><span class="badge good">Saved</span></div><div class="quickrow"><div class="left small"><b>Ready to share</b><small class="muted" style="display:block;margin-top:3px">Hermes + FloatRank</small></div>${btn('Review →','ride','linkbtn')}</div></div><div class="quickrow"><div class="providericon">⌁</div><div class="left"><b>Trails & events</b><div class="small muted">Your attempts and upcoming rides</div></div>${btn('View','trail','linkbtn')}</div>${btn('Manage connections','connections','linkbtn')}<p class="sourcecaption">${b.note}</p>`;
case 'standings':return `${heading('Leaderboards','Compare results with other riders.')}${tabs(s)}${offline}<h3>${b.metric}</h3><div class="filters"><label class="sr" for="period-${screen}">Period</label><select data-field="period" id="period-${screen}">${s.provider==='Hermes'?'<option>Fall season</option>':`<option ${s.period==='This month'?'selected':''}>This month</option><option ${s.period==='This week'?'selected':''}>This week</option>`}</select><span class="badge" style="align-self:center">${b.cohort}</span></div><div class="small muted">${s.provider==='Hermes'?'Fall season':s.period==='This week'?'Oct 12–18, 2026':'October 2026'} · UTC (fixture)</div>${(s.limited||s.scenario==='limited')?capabilityFallback(s):ranklist(s)}<div class="notice">${s.provider} · sample snapshot<br>As of 3:40 PM · fetched 3:42 PM<br>${b.note}</div>`;
case 'ride':return `${heading('Afternoon loop','Today, 2:18 PM · Onewheel')}${map()}<div class="statgrid"><div><strong>12.4 <small>mi</small></strong><span>Recorded distance</span></div><div><strong>48:12</strong><span>Moving time · complete</span></div></div><div class="sectiontitle"><h3>Send to services</h3><span class="badge">Manual send</span></div><div class="card" style="margin-top:0">${['Hermes','FloatRank','EUC Stats'].map(p=>`<label class="check"><input type="checkbox" data-destination="${p}" ${s.selected[p]?'checked':''}><span>${p}<small>${p==='FloatRank'?'Through your linked Hermes account':p==='Hermes'?'Ride and timed trail attempts':'This Onewheel ride has no eligible EUC category'}</small></span></label>`).join('')}</div><p class="footnote">FloatRank receives this ride through Hermes. We’ll send one copy.</p>${btn('Review selected destinations','review','primary',Object.values(s.selected).some(Boolean)?'':'disabled')}<p class="footnote">Your saved ride stays in CutOut. Nothing is sent until you confirm.</p>`;
case 'review':return `${heading('Review submission','Afternoon loop · today, 2:18 PM','ride')}<div class="card tint"><div class="eyebrow">Selected ride</div><div class="metric" style="font-size:35px;margin-top:8px">12.4 <small>mi</small></div><div class="reviewdestinations">${Object.keys(s.selected).filter(p=>s.selected[p]).map(p=>`<span class="badge">${p}</span>`).join('')||'<span class="small">No service selected</span>'}</div><p class="small muted" style="margin-top:9px">@you · FloatRank through Hermes</p></div><div class="sectiontitle"><h3>What you’re sharing</h3></div><div class="card" style="margin-top:0"><div class="listitem"><span>Route & timestamps</span><b>Precise</b></div><div class="listitem"><span>Speed & recorded telemetry</span><b>Included</b></div><div class="listitem"><span>Vehicle class</span><b>Onewheel</b></div></div><p class="compactnote"><b style="color:var(--ink)">Kept on this device</b><br>Music history, device identifiers, private notes and debug captures.</p><div class="visibility"><span aria-hidden="true">◈</span><div><b>Private processing, limited public route</b>Precise points go to the service. Your public route hides the start and end.</div></div><label class="check" style="margin-top:12px"><input id="consent" type="checkbox"><span>I agree to send this ride<small>To the selected services, with the data shown above.</small></span></label>${btn('Send ride','send','primary')}<div id="validation" role="status" class="small" style="color:var(--accentText);margin-top:10px"></div>`;
case 'status':{const names={Queued:'Waiting for connection',Received:'Ride received',Processing:'Provider is processing',UnderReview:'Result under review',Counted:'Ride counted',OutcomeUnknown:'Checking what happened',NeedsAuthorization:'Reconnect to continue',Cancelled:'Queued send cancelled'};const st=s.status;const received=['Received','Processing','UnderReview','Counted'].includes(st);return `${heading('Ride services','Afternoon loop · Hermes → FloatRank')}<div class="statusbox"><span class="badge ${st==='Counted'?'good':'gold'}">${st.replace(/([a-z])([A-Z])/g,'$1 $2')}</span><p style="margin-top:10px"><strong style="color:var(--ink)">${names[st]}</strong></p><p>${st==='Queued'?'Your ride is saved. This request will wait here until a connection is available.':st==='OutcomeUnknown'?'The send timed out. Check for an existing receipt before trying again.':st==='UnderReview'?'The provider is reviewing this ride. No rank is confirmed.':st==='NeedsAuthorization'?'The saved request is paused. Reconnect the same account to continue.':st==='Counted'?'Hermes confirmed this ride. FloatRank mileage can take longer to update.':st==='Cancelled'?'No queued request will be sent. Previously accepted remote copies may still exist.':'The service has your ride. Results will appear after it finishes processing.'}</p></div><ol class="timeline"><li class="done"><span class="dot">✓</span><div><b>Saved in CutOut</b><small>Available in your ride history</small></div></li><li class="${received?'done':'current'}"><span class="dot">${received?'✓':'2'}</span><div><b>Received by Hermes</b><small>${received?'Delivery confirmed':'No receipt yet'}</small></div></li><li class="${st==='Counted'?'done':received?'current':''}"><span class="dot">${st==='Counted'?'✓':'3'}</span><div><b>Processing and eligibility</b><small>${st==='UnderReview'?'Awaiting review':'Provider decides which attempts count'}</small></div></li><li class="${st==='Counted'?'current':''}"><span class="dot">4</span><div><b>Results and FloatRank mileage</b><small>Waiting for the service to update</small></div></li></ol>${st==='NeedsAuthorization'?btn('Reconnect Hermes','reconnect','primary'):st==='OutcomeUnknown'?btn('Check submission','received','primary'):st==='Counted'?btn('View standings','standings','primary'):btn('Back to ride','ride','primary')}${st==='Queued'?btn('Cancel send','cancel','linkbtn'):''}<p class="sourcecaption">Your local ride is saved independently of these services.</p>`}
case 'connections':return `${heading('Connections','Choose where your rides can participate.')}<div class="card">${['Hermes','FloatRank','EUC Stats'].map(p=>`<div class="row"><div class="providericon">${p==='Hermes'?'H':p==='FloatRank'?'F':'E'}</div><div class="left"><b>${p}</b><small>${s.connected?(p==='FloatRank'?'Through your Hermes account':'@you'):'Not connected'}</small></div><span class="badge ${s.connected?'good':''}">${s.connected?'Linked':'Unlinked'}</span></div>`).join('')}</div><div class="sectiontitle"><h3>Sharing preferences</h3></div><div class="card" style="margin-top:0"><div class="listitem"><span>Send saved rides</span><span>Manually</span></div><div class="listitem"><span>Standings & results</span><span>When available</span></div><div class="listitem"><span>Automatic uploads</span><span>Off</span></div></div>${btn(s.connected?'Unlink accounts':'Link accounts',s.connected?'unlink':'link','secondary')}<div id="connection-note" class="notice">Linking an account sends no rides. Unlinking stops queued sends. Rides already received by a service stay there until you remove them.</div>${btn('Review a saved ride','ride','primary')}`;
case 'trail':return `${heading('Pine Loop','Hermes · Onewheel · Fall season')}${map('Course version 3 · illustrative trail')}<div class="statgrid"><div><strong>1.2 <small>mi</small></strong><span>Course distance</span></div><div><strong>02:41</strong><span>Your best accepted attempt</span></div></div><div class="card tint"><div class="row"><div class="left"><b>#8 of 42 riders</b><small>Onewheel · Fall season</small></div><span class="badge gold">Personal best</span></div></div><div class="sectiontitle"><h3>Attempts from this ride</h3><span class="small muted">2 attempts</span></div><div class="card" style="margin-top:0"><div class="row"><div class="left"><b>02:41</b><small>Lap 2 · accepted by provider</small></div><span class="badge good">Best</span></div><div class="row"><div class="left"><b>02:49</b><small>Lap 1 · accepted by provider</small></div></div></div>${btn('View Hermes standings','hermesboard','primary')}<p class="footnote">Results from Hermes · course version 3. Check trail access and conditions before riding.</p>`;
case 'challenge':return `${heading('October together','Later concept · a native CutOut club challenge')}<div class="card tint"><div class="eyebrow">Foothill riders · invite only</div><h3 style="font-size:22px;margin-top:9px">October ride challenge</h3><p class="small muted" style="margin-top:10px">A shared completion goal with weekly caps. No speed score.</p><div class="metric" style="margin-top:16px">68 <small>/ 100 rides</small></div><div class="progress"><i></i></div><p class="tiny muted">12 riders · illustrative progress</p></div><div class="sectiontitle"><h3>Proposed rules</h3></div><div class="card" style="margin-top:0"><div class="listitem">At most 3 eligible rides per person / week</div><div class="listitem">Private routes; completion totals shared</div><div class="listitem">Rules and timezone fixed before opening</div><div class="listitem">Reports and result review available</div></div><div class="notice">Invited riders can take part when the organizer opens the challenge.</div>${btn('Not open yet','later','secondary','disabled')}<p class="footnote">Club challenge concept · not accepting entries.</p>`;
}}
function phone(screen,s){return `<article class="phone" data-screen="${screen}"><div class="topbar"><span>9:41</span><span aria-label="Full signal and battery">▮▮▮  ▰</span></div><div class="protolabel">Design concept · sample data</div><div class="content">${body(screen,s)}</div><div class="bottomnav" aria-label="Existing app shell, illustrative"><span><b>▣</b>Devices</span><span><b>⌖</b>Map</span><span class="active"><b>•••</b>More</span></div></article>`}
function reviewRail(){return `<aside class="designnote"><div class="eyebrow">Design review · 02</div><h3>Review the provider flows.</h3><p class="muted">CutOut already records your rides and progress. These screens add standings, submissions and provider results.</p><div class="servicelegend"><span>Hermes</span><span>FloatRank</span><span>EUC Stats</span></div><div class="reviewgroup"><h3>About this screen</h3><p class="muted">${{community:'Provider totals stay separate. Each service owns its ranks and accepted mileage.',standings:'The selected service, category, period and cohort define this board. A missing personal rank stays unknown.',ride:'This fixture uses an Onewheel ride. FloatRank is shown through a possible Hermes link, so the ride is sent once.',review:'The visibility shown here assumes an approved provider can process precise points privately and hide public endpoints. This capability still needs confirmation.',status:'Delivery, processing and a counted result are separate receipts. Use the controls below to inspect them.',connections:'These are fictional linked accounts. Actual authorization, reads and submission rights need provider agreements.',trail:'One ride can contain multiple attempts. Hermes owns matching and seasonal results.',challenge:'A later native CutOut contest concept. It has no entrants, scoring service or organizer backend.'}[state.screen]}</p></div><div class="reviewgroup fixture-controls"><h3>Try a service response</h3>${state.screen==='status'?[['received','Received'],['processing','Processing'],['held','Under review'],['counted','Counted'],['unknown','Unknown outcome'],['expired','Expired access']].map(([a,t])=>btn(t,a,'subtle')).join(''):btn('Toggle limited reads','limited','subtle')}<p class="muted" style="margin-top:10px">These controls change the fixture; they send nothing.</p></div><div class="reviewgroup"><h3>Review the plan</h3><p><a href="https://lific.mjc.lol/LIBCU/pages/182">Product, integrations and delivery →</a></p><p class="muted">All names, rides and results are examples. API access and display rights are unconfirmed. Local browser prototype; no credentials or remote writes.</p></div></aside>`}
function render(){document.documentElement.dataset.theme=state.theme;document.querySelector('#screen').value=state.screen;document.querySelector('#scenario').value=state.scenario;document.querySelector('#appearance').setAttribute('aria-pressed',state.theme==='dark');document.querySelector('#appearance').textContent=state.theme==='dark'?'Light appearance':'Dark appearance';document.querySelector('#sheet').setAttribute('aria-pressed',String(state.gallery));document.querySelector('#sheet').textContent=state.gallery?'Try the flow':'Screen set';document.querySelector('#main').innerHTML=state.gallery?`<section class="gallery">${screens.map((sc,i)=>`<div class="comp">${phone(sc,{...state,status:'UnderReview'})}<p><b>${String(i+1).padStart(2,'0')} / ${sc}</b><br>${['Provider totals and entry points','Attributed, scoped provider rankings','Existing ride, explicit destinations','Precise evidence and public visibility','Queued ≠ received ≠ ranked','Account state and independent capabilities','One ride can produce multiple attempts','Future native competition direction'][i]}</p></div>`).join('')}</section>`:`<section class="stage"><div id="demo">${phone(state.screen,state)}</div>${reviewRail()}</section>`}
document.querySelector('#scenario').addEventListener('change',e=>{state.scenario=e.target.value;render()});document.querySelector('#screen').addEventListener('change',e=>{state.screen=e.target.value;state.gallery=false;render()});document.querySelector('#appearance').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';render()};document.querySelector('#sheet').onclick=()=>{state.gallery=!state.gallery;render()};
document.addEventListener('change',e=>{if(e.target.dataset.destination){const p=e.target.dataset.destination;state.selected[p]=e.target.checked;if(p==='FloatRank'&&e.target.checked)state.selected.Hermes=true;if(p==='Hermes'&&!e.target.checked)state.selected.FloatRank=false;render()}if(e.target.dataset.field==='period'){state.period=e.target.value;render()}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.provider){state.provider=el.dataset.provider;render();return}const a=el.dataset.action;if(!a)return;if(state.gallery){state.gallery=false;state.screen=el.closest('.phone').dataset.screen;render();return}if(a==='retry'){state.scenario='normal'}else if(screens.includes(a)){state.screen=a}else if(a==='send'){if(!document.querySelector('#consent').checked){document.querySelector('#validation').textContent='Confirm the destinations and data before sending.';return}if(!state.connected){document.querySelector('#validation').textContent='Reconnect an account before sending.';return}if(state.selected['EUC Stats']){document.querySelector('#validation').textContent='EUC Stats needs a supported ride category. Deselect it for this Onewheel sample.';return}state.status='Queued';state.screen='status'}else if(a==='cancel')state.status='Cancelled';else if(a==='received')state.status='Received';else if(a==='processing')state.status='Processing';else if(a==='held')state.status='UnderReview';else if(a==='counted')state.status='Counted';else if(a==='unknown')state.status='OutcomeUnknown';else if(a==='expired')state.status='NeedsAuthorization';else if(a==='reconnect'){state.connected=true;state.status='Queued'}else if(a==='unlink'){state.connected=false;if(['Queued','NeedsAuthorization'].includes(state.status))state.status='Cancelled'}else if(a==='link'){state.connected=true}else if(a==='limited'){state.limited=!state.limited}else if(a==='hermesboard'){state.provider='Hermes';state.screen='standings'}else if(a==='external'){el.textContent='Provider link · preview only';return}render()});
render();
</script>
</body></html>
