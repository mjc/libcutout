[project]
name = "libcutout"
revision = "1.0"

[providers]
local = "keyring://"

[profiles.development]
CUTOUT_IOS_DEVELOPMENT_TEAM = { description = "Apple development team identifier for signed device builds", providers = ["local"] }
CUTOUT_SPOTIFY_CLIENT_ID = { description = "Spotify client ID passed to signed app builds", providers = ["local"] }
CUTOUT_APPSTORE_AUTH_KEY_PATH = { description = "App Store Connect private key material", as_path = true, required = false, providers = ["local"] }
CUTOUT_APPSTORE_AUTH_KEY_ID = { description = "App Store Connect key identifier", required = false, providers = ["local"] }
CUTOUT_APPSTORE_AUTH_KEY_ISSUER_ID = { description = "App Store Connect issuer identifier", required = false, providers = ["local"] }

[scopes.ios-device-deploy]
secrets = ["CUTOUT_IOS_DEVELOPMENT_TEAM", "CUTOUT_SPOTIFY_CLIENT_ID"]

[scopes.ios-ad-hoc-export]
secrets = [
  "CUTOUT_IOS_DEVELOPMENT_TEAM",
  "CUTOUT_SPOTIFY_CLIENT_ID",
  "CUTOUT_APPSTORE_AUTH_KEY_PATH",
  "CUTOUT_APPSTORE_AUTH_KEY_ID",
  "CUTOUT_APPSTORE_AUTH_KEY_ISSUER_ID",
]
