inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
  rust-overlay:
    url: github:oxalica/rust-overlay
    overlays:
      - default
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
nixpkgs:
  permitted_unfree_packages:
    - android-sdk-ndk
    - platform-tools
    - android-sdk-platform-tools
    - android-sdk-cmdline-tools
    - android-sdk-build-tools
    - android-sdk-platforms
    - androidsdk
    - build-tools
    - cmdline-tools
    - platforms
    - ndk
    - android-sdk-emulator
    - android-sdk-system-image-35-google_apis-x86_64
    - system-image-35-google_apis-x86_64
    - emulator
