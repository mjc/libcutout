[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # UniFFI is MPL-2.0. Keep source provenance explicit and do not copy
    # generator implementation code into Cutout's MIT OR Apache-2.0 crates.
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Gungraun is benchmark-only and pins bincode 1.3.3; cargo-deny reports
    # no safe upgrade for this unmaintained dependency.
    "RUSTSEC-2025-0141",
    # Gungraun's benchmark-only proc-macro dependency has no safe upgrade in
    # the pinned release.
    "RUSTSEC-2026-0173",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
