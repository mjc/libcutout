#:schema https://dystroy.org/bacon/.bacon.schema.json

default_job = "check"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check"]
need_stdout = false

[jobs.run]
command = [
    "cargo",
    "run",
    "-p",
    "cutout-cli",
    "--",
    "dashboard",
    "--device",
    "NF2557",
    "--seconds",
    "30",
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
kill = ["pkill", "-TERM", "-P"]
scroll_anchor = "auto"
show_command_error_code = true
