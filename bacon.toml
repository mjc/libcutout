#:schema https://dystroy.org/bacon/.bacon.schema.json

default_job = "check"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check"]
need_stdout = false

[jobs.run]
command = ["cargo", "run"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
kill = [
    "sh",
    "-c",
    "kill_tree() { for child in $(pgrep -P \"$1\"); do kill_tree \"$child\"; done; kill -TERM \"$1\" 2>/dev/null || true; }; kill_tree \"$1\"",
    "cutout-bacon-kill",
]
scroll_anchor = "auto"
show_command_error_code = true
